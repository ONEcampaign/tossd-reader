name: Codelist drift

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.12
        run: uv python install '3.12'

      - name: Install dependencies (codelists group)
        run: uv sync --frozen --group codelists

      - name: Refresh codelists into a temp directory
        run: |
          uv run python scripts/refresh_codelists.py \
            --output-dir "${{ runner.temp }}/codelists-candidate"

      - name: Diff the refreshed snapshot against the packaged one
        id: diff
        run: |
          exit_code=0
          uv run python scripts/refresh_codelists.py --check \
            src/tossd_reader/_data/codelists \
            "${{ runner.temp }}/codelists-candidate" > drift-report.txt || exit_code=$?
          cat drift-report.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Ensure the data-drift label exists
        if: steps.diff.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-drift \
            --color b60205 \
            --description "OECD codelist snapshot has drifted from the packaged one" \
            --force

      - name: Open a drift issue (skipping if one is already open)
        if: steps.diff.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --label data-drift --json number,title \
            --jq '[.[] | select(.title | startswith("Codelist drift detected"))][0].number // empty')
          if [ -n "$existing" ]; then
            echo "An open codelist-drift issue already exists (#$existing); not creating a duplicate."
            exit 0
          fi
          gh issue create \
            --title "Codelist drift detected $(date -u +%F)" \
            --label data-drift \
            --body-file drift-report.txt
